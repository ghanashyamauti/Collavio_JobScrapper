version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: collavio-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-}
      - FALLBACK_SQLITE_FOR_LOCAL_DEV=${FALLBACK_SQLITE_FOR_LOCAL_DEV:-true}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-http://localhost:5173,http://localhost:80,http://localhost}
      - SYNC_INTERVAL_HOURS=${SYNC_INTERVAL_HOURS:-1}
    env_file:
      - path: ./backend/.env
        required: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
    container_name: collavio-frontend
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
